name: pipeline

on:
  push:
    branches: [main]
  schedule:
    # 20:00 UTC = 06:00 AEST / 07:00 AEDT -- once daily, after archive-api's
    # ERA5 publication lag has cleared for "yesterday" everywhere in AU.
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run unit tests
        run: PYTHONPATH=src pytest tests/ -v

  run-pipeline:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run bronze -> silver -> gold -> dashboard
        run: python src/pipeline.py
      - name: Commit refreshed gold data + dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gold docs/index.html
          git diff --cached --quiet && echo "no changes to commit" || \
            git commit -m "chore: scheduled pipeline refresh [skip ci]"
          git push
